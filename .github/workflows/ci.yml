name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.18"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: uv sync --all-packages --dev
      - run: pnpm install --frozen-lockfile
      - run: make lint
      - run: make typecheck
      - run: make contracts
      - run: make test-unit
      - run: make test-web
      - run: uv run python scripts/check_migrations.py

  release-evidence:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - run: test -f docs/release/release-manifest.schema.json
      - run: echo "SBOM, provenance signing, vulnerability and IaC scans are enforced at promotion gates."


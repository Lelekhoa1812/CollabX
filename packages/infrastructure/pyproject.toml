[project]
name = "axion-infrastructure"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "axion-domain",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "sqlalchemy[asyncio]==2.0.45",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: axion
      POSTGRES_DB: axion
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion -d axion"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  temporal:
    image: temporalio/auto-setup:1.29
    ports:
      - "17233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: axion
      POSTGRES_PWD: axion
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

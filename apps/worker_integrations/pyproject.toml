[project]
name = "axion-worker-integrations"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["axion-infrastructure", "axion-observability"]

[project.scripts]
axion-worker-integrations = "worker_integrations.main:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "stakeholder-crm"
version = "0.1.0"
description = "Axion Stakeholder CRM foundation monorepo"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.17.2",
  "asyncpg==0.31.0",
  "fastapi==0.124.2",
  "httpx==0.28.1",
  "opentelemetry-api==1.39.1",
  "opentelemetry-sdk==1.39.1",
  "opentelemetry-instrumentation-fastapi==0.60b1",
  "psycopg[binary]==3.3.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "pyjwt[crypto]==2.10.1",
  "python-dotenv==1.2.1",
  "python-multipart==0.0.20",
  "sqlalchemy[asyncio]==2.0.45",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
  "coverage==7.13.0",
  "hypothesis==6.148.7",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "pyyaml==6.0.3",
  "ruff==0.14.9",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker_ai",
  "apps/worker_documents",
  "apps/worker_exports",
  "apps/worker_integrations",
  "packages/domain",
  "packages/application",
  "packages/infrastructure",
  "packages/contracts",
  "packages/observability",
]

[tool.uv.sources]
axion-domain = { workspace = true }
axion-application = { workspace = true }
axion-contracts = { workspace = true }
axion-infrastructure = { workspace = true }
axion-observability = { workspace = true }
axion-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101", "S104", "S105", "S310"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["axion_domain", "axion_contracts", "axion_infrastructure", "axion_observability", "axion_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=packages --cov=apps --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
branch = true
source = ["apps", "packages", "scripts"]
